dependencies:
  idf:
    version: ">=4.1.0"
  
  sepfy/srtp:
    version: "^2.3.0"

  78/esp-opus:
    version: "^1.0.4"
    rules:
    - if: ${BUILD_BOARD} not in ["esp32s3_korvo_2", "esp-box", "esp-sparkbot"]


  espressif2022/esp_sparkbot:
    version: "^1.0.1"
    rules:
    - if: "${BUILD_BOARD} == esp-sparkbot"

  espressif/esp32_s3_korvo_2:
    version: "^3.0.0"
    rules:
    - if: "${BUILD_BOARD} == esp32s3_korvo_2"

  espressif/esp-box:
    version: "^3.1.0"
    rules:
    - if: "${BUILD_BOARD} == esp-box"

  espressif/esp_gmf_core:
    version: "^0.5.0"
    rules:
    - if: ${BUILD_BOARD} in ["esp32s3_korvo_2", "esp-box", "esp-sparkbot"]

  espressif/esp_gmf_io:
    version: "^0.5.1"
    rules:
    - if: ${BUILD_BOARD} in ["esp32s3_korvo_2", "esp-box", "esp-sparkbot"]

  espressif/esp_gmf_misc:
    version: "^0.5.1"
    rules:
    - if: ${BUILD_BOARD} in ["esp32s3_korvo_2", "esp-box", "esp-sparkbot"]

  espressif/esp_gmf_audio:
    version: "^0.5.1"
    rules:
    - if: ${BUILD_BOARD} in ["esp32s3_korvo_2", "esp-box", "esp-sparkbot"]

  espressif/esp_audio_simple_player:
    version: "^0.9.1"
    rules:
    - if: ${BUILD_BOARD} in ["esp32s3_korvo_2", "esp-box", "esp-sparkbot"]
